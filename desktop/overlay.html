<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>宝宝表情包</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: "Yuanti SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
  }

  #stage { position: fixed; inset: 0; touch-action: none; }
  .sticker { position: absolute; cursor: grab; touch-action: none; will-change: left, top; z-index: 10; }
  .sticker.grabbing { cursor: grabbing; z-index: 400; }
  .sticker-inner { position: relative; transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
  .sticker.grabbing .sticker-inner { transition: none; }
  .jumper { will-change: transform; }
  .jumper img { display: block; width: 100%; height: auto; pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
  .jumper.jump  { animation: jump .55s cubic-bezier(.28,1.6,.4,1); }
  .jumper.wiggle{ animation: wiggle .7s ease-in-out; }
  .jumper.dance { animation: dance .8s ease-in-out; }
  @keyframes jump {
    0% { transform: translateY(0) scale(1,1); }
    25% { transform: translateY(-4%) scale(.94,1.08); }
    55% { transform: translateY(-26%) scale(1.06,.94); }
    80% { transform: translateY(0) scale(.96,1.06); }
    100%{ transform: translateY(0) scale(1,1); }
  }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-7deg); } 40% { transform: rotate(6deg); }
    60% { transform: rotate(-4deg); } 80% { transform: rotate(3deg); }
  }
  @keyframes dance {
    0%,100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-6deg) translateY(-12%); }
    50% { transform: rotate(0) translateY(0); }
    75% { transform: rotate(6deg) translateY(-12%); }
  }

  .bubble {
    position: absolute; left: 50%; bottom: calc(100% + 10px);
    transform: translateX(-50%) scale(0); transform-origin: bottom center;
    background: #fff; color: #ff6f9c; white-space: nowrap;
    font-size: 16px; letter-spacing: 1px; padding: 7px 13px; border-radius: 16px;
    border: 2.5px solid #ffb7c9; box-shadow: 0 6px 16px rgba(0,0,0,.18);
    pointer-events: none; z-index: 600;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -9px;
    width: 14px; height: 14px; background: #fff;
    border-right: 2.5px solid #ffb7c9; border-bottom: 2.5px solid #ffb7c9;
    transform: translateX(-50%) rotate(45deg);
  }
  .bubble.show { animation: bubble-pop .3s cubic-bezier(.34,1.8,.64,1) forwards; }
  .bubble.hide { animation: bubble-out .25s ease forwards; }
  @keyframes bubble-pop { to { transform: translateX(-50%) scale(1); } }
  @keyframes bubble-out { from { transform: translateX(-50%) scale(1); opacity: 1; } to { transform: translateX(-50%) scale(.4); opacity: 0; } }

  .particle {
    position: fixed; pointer-events: none; z-index: 800; font-size: 22px;
    animation: burst .9s cubic-bezier(.2,.7,.4,1) forwards;
  }
  @keyframes burst {
    from { transform: translate(0,0) scale(.6) rotate(0); opacity: 1; }
    to   { transform: translate(var(--dx), var(--dy)) scale(1.25) rotate(var(--rot)); opacity: 0; }
  }
  .confetti {
    position: fixed; top: -40px; pointer-events: none; z-index: 799; font-size: 24px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(var(--rot)); } }
  .rise-emoji {
    position: absolute; left: 50%; top: 0; pointer-events: none; z-index: 550;
    font-size: 20px; animation: rise 1.6s ease-out forwards;
  }
  @keyframes rise {
    from { transform: translate(-50%, 0) scale(.7); opacity: 0; }
    20%  { opacity: 1; }
    to   { transform: translate(-50%, -70px) scale(1.15); opacity: 0; }
  }

</style>
</head>
<body>
  <div id="stage"></div>

<script>
(() => {
  const BABIES = [
    { img: 'stickers/baby-1.png', phrase: '喜欢你',  emoji: '💗', say: ['最喜欢你啦～', '抱抱！', '心给你 💓'] },
    { img: 'stickers/baby-2.png', phrase: '谢谢你哦', emoji: '🙏', say: ['谢谢谢谢你～', '么么哒！', '你真好 🥰'] },
    { img: 'stickers/baby-3.png', phrase: '我可以',  emoji: '👍', say: ['我可以！冲鸭！', '没问题～', '包在我身上 💪'] },
    { img: 'stickers/baby-4.png', phrase: '怎么啦?',  emoji: '🤔', say: ['怎么啦？', '你说什么呀？', '我听听 👂'] },
    { img: 'stickers/baby-5.png', phrase: '保密',    emoji: '🤫', say: ['嘘——保密！', '我不说～', '偷偷告诉你…才不！'] },
    { img: 'stickers/baby-6.png', phrase: '太开心啦', emoji: '🎉', say: ['太开心啦！！', '耶耶耶！', '开心到飞起 🛫'] },
    { img: 'stickers/baby-7.png', phrase: '睡觉觉',  emoji: '💤', say: ['困困了…', '呼呼 zzZ', '别吵，睡觉觉 💤'] },
    { img: 'stickers/baby-8.png', phrase: '羞羞',    emoji: '😳', say: ['哎呀羞羞！', '不许看我～', '脸红红了 (>﹏<)'] },
    { img: 'stickers/baby-9.png', phrase: '拜拜呀',  emoji: '👋', say: ['拜拜呀～', '下次再玩哦！', '挥挥小手 👋'] },
  ];
  const SPARKS = ['❤️','✨','🌟','💫','🎈','🌈','🧸','🍭'];
  const CONFETTI = ['🎉','🎊','✨','🎈','🌟','💗','💛','💙'];
  const KAOMOJI = ['(๑•̀ㅂ•́)و✧','ヾ(≧▽≦*)o','(｡･ω･｡)','٩(❛ᴗ❛)۶','(づ￣ ³￣)づ'];
  // 🌙 作息规矩：过了 BEDTIME_HOUR 点到 WAKE_HOUR 点，只能陪睡觉觉宝宝
  const BEDTIME_HOUR = 23, WAKE_HOUR = 7, SLEEPY_IDX = 6;
  const qp = new URLSearchParams(location.search);
  const isBedtime = () => qp.get('bedtime') === '1' ||
    (h => h >= BEDTIME_HOUR || h < WAKE_HOUR)(new Date().getHours());
  const BEDTIME_NO = ['嘘…已经 23 点啦，要睡觉觉 💤', '晚上只能陪睡觉觉宝宝哦 😴', '换宝宝明天再说吧～'];
  const SLEEPY_SAY = ['呼呼…zzZ', '23 点啦，睡觉觉…', '晚安，明天再玩 💤'];
  const FLING_SPEED = 1100; // 甩向屏幕边缘、撞击速度超过它 → 换宝宝

  const stage = document.getElementById('stage');
  const SW = () => window.innerWidth, SH = () => window.innerHeight;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  /* ============ 鼠标穿透切换：只有悬停在宝宝上才可点击 ============ */
  let ignoreState = true;
  function setIgnore(ignore) {
    if (ignore === ignoreState) return;
    ignoreState = ignore;
    window.petAPI?.setIgnore(ignore);
  }
  window.addEventListener('mousemove', e => {
    lastMouse.x = e.clientX; lastMouse.y = e.clientY;
    if (asleep) return;
    setIgnore(!e.target.closest('.sticker'));
  });
  window.addEventListener('contextmenu', e => {
    if (!e.target.closest('.sticker')) return;
    e.preventDefault();
    releaseDrag(); // 右键按下会触发 pointerdown，开菜单前必须清掉拖拽状态
    if (window.petAPI) { setIgnore(false); window.petAPI.showMenu(e.clientX, e.clientY); }
  });

  /* ================= 音效（WebAudio 现场合成） ================= */
  let actx = null, muted = localStorage.getItem('babyMuted') === '1';
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(f0, f1, dur, type = 'sine', vol = .13) {
    if (muted || !actx) return;
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  }
  const sndGrab  = () => tone(300, 520, .09, 'triangle', .1);
  const sndThrow = () => tone(520, 260, .14, 'triangle', .09);
  const sndBoing = () => { tone(700, 1100, .08, 'sine', .1); setTimeout(() => tone(1100, 800, .1, 'sine', .08), 70); };
  const sndChime = () => { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, f * 1.02, .18, 'sine', .08), i * 90)); };
  const sndPoof  = () => tone(900, 300, .16, 'triangle', .09);

  /* ================= 贴纸 & 物理 ================= */
  const stickers = [];
  // 模式：single = 桌面只有一个宝宝（默认）；all = 9 个全体上场
  let mode = localStorage.getItem('babyMode') === 'all' ? 'all' : 'single';
  let activeIdx = Math.min(8, Math.max(0, parseInt(localStorage.getItem('babyActive') || '2', 10) || 0));
  let asleep = false;
  // 👀 探头跟随：宝宝贴在屏幕边，跟着鼠标上下移动，鼠标靠近就探出来
  let peekMode = localStorage.getItem('babyPeek') !== '0';
  let peekReveal = 0.45;
  let lastGreet = 0;
  let pinned = false; // 轻放固定：宝宝停在用户放的位置
  let danceMode = false; // 🎵 音乐模式：跟着节奏蹦跳滚动
  const lastMouse = { x: SW() * 0.6, y: SH() * 0.4 };

  BABIES.forEach((b) => {
    const el = document.createElement('div');
    el.className = 'sticker';
    el.innerHTML = `<div class="sticker-inner"><div class="jumper"><img src="${b.img}" alt="${b.phrase}" draggable="false"></div></div>`;
    stage.appendChild(el);
    const img = el.querySelector('img');
    const s = {
      b, el, jumper: el.querySelector('.jumper'),
      x: 0, y: 0, vx: 0, vy: 0, home: { x: 0, y: 0 },
      baseAngle: rand(-5, 5), dragging: false, grabbed: false,
      bobPhase: rand(0, Math.PI * 2), w: 140, h: 210,
      lastTap: 0, bubbleTimer: null,
    };
    img.addEventListener('load', () => { s.h = s.w * (img.naturalHeight / img.naturalWidth); });
    stickers.push(s);
    const pre = new Image(); pre.src = b.img; // 预加载，切换不闪
  });

  function setStickerSize(s, w) {
    s.w = w; s.el.style.width = w + 'px';
    const img = s.el.querySelector('img');
    s.h = w * (img.naturalHeight && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1.5);
  }

  const singleW = () => Math.max(104, Math.min(148, SW() * 0.11));
  function singleHome(s) {
    return { x: SW() - s.w - Math.max(34, SW() * 0.045), y: SH() * rand(.38, .48) };
  }

  // 每行最高贴纸宽高比（h/w，含余量），全体上场时用
  const ROW_RATIO = [1.48, 1.82, 1.65];
  function rowWidth(r, cellH) {
    return Math.max(80, Math.min(stWidth(), (cellH - 24) / ROW_RATIO[r]));
  }
  const stWidth = () => Math.max(90, Math.min(170, SW() * 0.125));

  function layoutHomes(resetPos = false) {
    if (mode === 'single') {
      const s = stickers[activeIdx];
      setStickerSize(s, singleW());
      s.home = singleHome(s);
      if (resetPos && !s.dragging) { s.x = s.home.x; s.y = s.home.y; s.vx = s.vy = 0; }
      return;
    }
    const top = 26, bottom = SH() - 30, left = SW() * .08, right = SW() * .92;
    const cellH = (bottom - top) / 3, cellW = (right - left) / 3;
    stickers.forEach((s, idx) => {
      const r = Math.floor(idx / 3), c = idx % 3;
      setStickerSize(s, rowWidth(r, cellH));
      const cx = left + cellW * (c + .5) + rand(-14, 14);
      const cy = top + cellH * (r + .5) + rand(-6, 6);
      s.home = { x: cx - s.w / 2, y: Math.max(10, cy - s.h / 2) };
      if (resetPos && !s.dragging) { s.x = s.home.x; s.y = s.home.y; s.vx = s.vy = 0; }
    });
  }

  function applyMode(m, resetPos = true) {
    mode = m;
    localStorage.setItem('babyMode', m === 'all' ? 'all' : 'single');
    stickers.forEach((s, i) => {
      s.el.style.display = (m === 'all' || i === activeIdx) ? '' : 'none';
    });
    layoutHomes(resetPos);
    window.petAPI?.peekState(peekMode);
  }


  /* ---- 换宝宝（滚轮 / 双击 / 甩飞 / 菜单） ---- */
  function switchTo(i, enter) {
    activeIdx = ((i % BABIES.length) + BABIES.length) % BABIES.length;
    localStorage.setItem('babyActive', String(activeIdx));
    const old = stickers.find(s => s.el.style.display !== 'none');
    const oldCX = old ? old.x + old.w / 2 : 0, oldBottom = old ? old.y + old.h : 0;
    asleep = false; stage.style.display = '';
    if (mode !== 'single') applyMode('single', false);
    stickers.forEach((s, idx) => { s.el.style.display = idx === activeIdx ? '' : 'none'; });

    const s = stickers[activeIdx];
    setStickerSize(s, singleW());
    s.home = singleHome(s);
    if (old && old !== s) burst(old.x + old.w / 2, old.y + old.h / 2, 12);

    if (pinned && !enter && old && old !== s) {
      // 固定模式下原地换宝宝：保持底边对齐
      s.x = Math.max(0, Math.min(oldCX - s.w / 2, SW() - s.w));
      s.y = Math.max(-8, oldBottom - s.h);
      s.vx = s.vy = 0;
    } else if (enter === 'left')  { s.x = -s.w - 10;  s.y = s.home.y; s.vx = 520;  s.vy = 0; }
    else if (enter === 'right') { s.x = SW() + 10;  s.y = s.home.y; s.vx = -520; s.vy = 0; }
    else if (enter === 'top')   { s.y = -s.h - 10;  s.x = s.home.x; s.vx = 0; s.vy = 520; }
    else                        { s.x = s.home.x;   s.y = s.home.y; s.vx = 0; s.vy = 0; }

    playAnim(s, 'jump');
    riseEmoji(s, s.b.emoji);
    showBubble(s, s.b.phrase + '！', 1300);
    sndPoof();
  }

  // 睡觉时间里的换宝宝请求一律拒绝（睡觉觉除外）
  function trySwitch(i, enter) {
    if (isBedtime()) {
      if (activeIdx !== SLEEPY_IDX) {
        showBubble(stickers[activeIdx], pick(BEDTIME_NO), 2200);
        playAnim(stickers[activeIdx], 'wiggle');
      }
      return false;
    }
    switchTo(i, enter);
    return true;
  }

  let lastWheel = 0;
  window.addEventListener('wheel', e => {
    if (!e.target.closest('.sticker')) return;
    e.preventDefault();
    const now = performance.now();
    if (now - lastWheel < 350) return;
    lastWheel = now;
    ensureAudio();
    trySwitch(activeIdx + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  let lastT = performance.now();
  function tick(now) {
    const dt = Math.min(.033, (now - lastT) / 1000); lastT = now;
    const t = now / 1000;
    const peeking = mode === 'single' && peekMode && !asleep;
    for (const s of stickers) {
      if (s.el.style.display === 'none') continue;
      if (!danceMode || s.dragging) s.spin = (s.spin || 0) * Math.max(0, 1 - dt * 2.5);
      if (s.dragging) {
        s.vx *= .8; s.vy *= .8; s.extraTilt = 0;
      } else if (danceMode && !asleep) {
        // 🎵 音乐模式：重力蹦跳 + 滚动，落地打节拍冒音符
        s.extraTilt = 0;
        s.vy += 2400 * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.spin = (s.spin || 0) + s.vx * dt * .25;
        const dMaxX = SW() - s.w, dMaxY = SH() - s.h;
        if (s.x < 0) { s.x = 0; s.vx = Math.abs(s.vx) || rand(120, 260); }
        if (s.x > dMaxX) { s.x = dMaxX; s.vx = -Math.abs(s.vx || rand(120, 260)); }
        if (s.y > dMaxY) {
          s.y = dMaxY;
          s.vy = -rand(650, 1000);
          s.vx = (Math.random() < .5 ? -1 : 1) * rand(140, 340);
          tone(110 + Math.random() * 90, 70, .09, 'sine', .05);
          riseEmoji(s, isBedtime() ? '💤' : pick(['🎵', '🎶', '✨']));
        }
        if (s.y < 0) { s.y = 0; s.vy = Math.abs(s.vy) * .6; }
      } else if (mode === 'single' && pinned && !asleep) {
        s.vx = s.vy = 0; s.extraTilt = 0; // 定住不动
      } else if (peeking && Math.hypot(s.vx, s.vy) < 600) {
        // 👀 跟着鼠标探头：上下滑动追踪，靠近时多探出来一点
        const cx = s.x + s.w * .5, cy = s.y + s.h * .5;
        const dist = Math.hypot(lastMouse.x - cx, lastMouse.y - cy);
        const near = Math.max(0, Math.min(1, 1 - (dist - 140) / 360));
        peekReveal += (0.45 + 0.55 * near - peekReveal) * Math.min(1, dt * 3.5);
        const tx = SW() - s.w * peekReveal;
        const ty = Math.max(-10, Math.min(SH() - s.h + 6, lastMouse.y - s.h * .5));
        s.extraTilt = Math.max(-9, Math.min(9, (ty - s.y) * .06));
        s.x += (tx - s.x) * Math.min(1, dt * 4.5);
        s.y += (ty - s.y) * Math.min(1, dt * 6);
        s.vx = s.vy = 0;
        if (near > .92 && performance.now() - lastGreet > 18000) {
          lastGreet = performance.now();
          showBubble(s, pick(['看到你啦 👀', '嘿嘿，在偷看我吗～', '我就知道你在找我 💓']), 1500);
          playAnim(s, 'wiggle');
        }
      } else {
        s.extraTilt = 0;
        const k = 3.2, damp = 1.6;
        s.vx += (s.home.x - s.x) * k * dt;
        s.vy += (s.home.y - s.y) * k * dt;
        s.vx *= (1 - damp * dt); s.vy *= (1 - damp * dt);
        s.vx = Math.max(-2600, Math.min(2600, s.vx));
        s.vy = Math.max(-2600, Math.min(2600, s.vy));
        s.x += s.vx * dt; s.y += s.vy * dt;

        const maxX = SW() - s.w, maxY = SH() - s.h;
        const fling = mode === 'single' && !s.dragging;
        if (s.x < 0) {
          if (fling && Math.abs(s.vx) > FLING_SPEED && trySwitch(activeIdx + 1, 'right')) continue;
          s.x = 0; s.vx = Math.abs(s.vx) * .68;
        }
        if (s.x > maxX) {
          if (fling && Math.abs(s.vx) > FLING_SPEED && trySwitch(activeIdx + 1, 'left')) continue;
          s.x = maxX; s.vx = -Math.abs(s.vx) * .68;
        }
        if (s.y < 0)    { s.y = 0;    s.vy = Math.abs(s.vy) * .68; }
        if (s.y > maxY) {
          if (fling && Math.abs(s.vy) > FLING_SPEED && trySwitch(activeIdx + 1, 'top')) continue;
          s.y = maxY;
          if (Math.abs(s.vy) > 120) { s.vy = -Math.abs(s.vy) * .5; tone(rand(200,300), rand(120,180), .08, 'sine', .04); }
          else s.vy = 0;
          s.vx *= .92;
        }
      }
      const settled = !s.dragging && Math.abs(s.vx) < 8 && Math.abs(s.vy) < 8;
      const bobY = settled ? Math.sin(t * 2 + s.bobPhase) * 5 : 0;
      const tilt = s.baseAngle + Math.max(-9, Math.min(9, s.vx * .012)) + (s.extraTilt || 0) + (s.spin || 0);
      const grabScale = s.grabbed ? 1.14 : (settled ? 1 + Math.sin(t * 2 + s.bobPhase) * .008 : 1);
      s.el.style.left = s.x + 'px';
      s.el.style.top = (s.y + bobY) + 'px';
      s.el.querySelector('.sticker-inner').style.transform =
        `rotate(${tilt}deg) scale(${grabScale})`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ================= 气泡 / 粒子 ================= */
  function showBubble(s, text, dur = 1800) {
    clearTimeout(s.bubbleTimer);
    s.el.querySelector('.bubble')?.remove();
    const bub = document.createElement('div');
    bub.className = 'bubble'; bub.textContent = text;
    s.el.appendChild(bub);
    requestAnimationFrame(() => bub.classList.add('show'));
    s.bubbleTimer = setTimeout(() => {
      bub.classList.remove('show'); bub.classList.add('hide');
      setTimeout(() => bub.remove(), 260);
    }, dur);
  }
  function burst(x, y, n = 10, pool = SPARKS) {
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span');
      p.className = 'particle'; p.textContent = pick(pool);
      const ang = rand(0, Math.PI * 2), d = rand(50, 140);
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--dx', Math.cos(ang) * d + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * d - 30 + 'px');
      p.style.setProperty('--rot', rand(-220, 220) + 'deg');
      p.style.fontSize = rand(16, 30) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 950);
    }
  }
  function confettiRain(n = 26) {
    for (let i = 0; i < n; i++) {
      const c = document.createElement('span');
      c.className = 'confetti'; c.textContent = pick(CONFETTI);
      c.style.left = rand(0, 100) + 'vw';
      c.style.setProperty('--rot', rand(-360, 360) + 'deg');
      c.style.animationDuration = rand(1.6, 3.2) + 's';
      c.style.fontSize = rand(18, 32) + 'px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3400);
    }
  }
  function riseEmoji(s, emoji) {
    const e = document.createElement('span');
    e.className = 'rise-emoji'; e.textContent = emoji;
    s.el.appendChild(e);
    setTimeout(() => e.remove(), 1650);
  }
  function playAnim(s, cls) {
    s.jumper.classList.remove(cls); void s.jumper.offsetWidth;
    s.jumper.classList.add(cls);
    setTimeout(() => s.jumper.classList.remove(cls), 900);
  }

  /* ================= 指针交互 ================= */
  let active = null, lastPointer = { x: 0, y: 0 };
  stage.addEventListener('pointerdown', e => {
    if (asleep || e.button !== 0) return; // 只允许左键拖拽，右键留给菜单
    ensureAudio();
    const el = e.target.closest('.sticker');
    if (!el) return;
    const s = stickers.find(v => v.el === el);
    active = s; s.dragging = true; s.grabbed = true;
    el.classList.add('grabbing');
    el.setPointerCapture?.(e.pointerId);
    lastPointer = { x: e.clientX, y: e.clientY };
    s.grabX = e.clientX; s.grabY = e.clientY;
    s.vx = s.vy = 0;
    setIgnore(false);
    sndGrab();
  });
  window.addEventListener('pointermove', e => {
    if (!active || !active.dragging) return;
    const dx = e.clientX - lastPointer.x, dy = e.clientY - lastPointer.y;
    lastPointer = { x: e.clientX, y: e.clientY };
    active.x += dx; active.y += dy;
    active.vx = active.vx * .5 + dx * 34 * .5;  // 平滑估算，抖动不误判成甩
    active.vy = active.vy * .5 + dy * 34 * .5;
    active.x = Math.max(-20, Math.min(SW() - active.w + 20, active.x));
    active.y = Math.max(-10, Math.min(SH() - active.h, active.y));
  });
  function releaseDrag() {
    if (!active) return;
    active.dragging = false; active.grabbed = false;
    active.el.classList.remove('grabbing');
    active = null;
  }
  window.addEventListener('pointerup', e => {
    if (!active) return;
    const s = active;
    releaseDrag();
    const dragDist = Math.hypot(e.clientX - (s.grabX ?? e.clientX), e.clientY - (s.grabY ?? e.clientY));
    const speed = Math.hypot(s.vx, s.vy);
    if (dragDist < 12) {
      handleTap(s); // 原地点一下
    } else if (speed < 650) {
      pinHere(s); // 轻放：固定在当前位置（慢慢松手就行）
    } else {
      pinned = false; localStorage.removeItem('babyPin');
      sndThrow();
    }
  });

  function pinHere(s) {
    pinned = true;
    s.x = Math.max(0, Math.min(s.x, SW() - s.w));
    s.y = Math.max(4, Math.min(s.y, SH() - s.h));
    s.vx = s.vy = 0;
    localStorage.setItem('babyPin', JSON.stringify({ x: Math.round(s.x), y: Math.round(s.y) }));
    showBubble(s, pick(['就待在这儿啦 📍', '好嘞，放在这里～', '固定！有事随时叫我']), 1600);
    riseEmoji(s, '📍');
  }

  function handleTap(s) {
    const now = performance.now();
    const isDouble = now - s.lastTap < 380;
    s.lastTap = now;
    if (isDouble) {
      // 双击：撒星星 + 换下一个宝宝（睡觉时间会拒绝）
      burst(s.x + s.w / 2, s.y + s.h * .35, 12);
      trySwitch(activeIdx + 1);
    } else {
      playAnim(s, 'jump');
      riseEmoji(s, isBedtime() ? '💤' : s.b.emoji);
      showBubble(s, pick(isBedtime() ? SLEEPY_SAY : s.b.say));
      sndBoing();
    }
  }

  /* ================= 主进程菜单指令 ================= */
  window.petAPI?.onCommand((cmd, payload) => {
    ensureAudio();
    if (cmd === 'party') {
      confettiRain(); sndChime();
      stickers.filter(s => s.el.style.display !== 'none')
        .forEach((s, i) => setTimeout(() => playAnim(s, 'dance'), i * 100));
    } else if (cmd === 'home') {
      pinned = false; localStorage.removeItem('babyPin');
      sndChime();
      stickers.forEach(s => { if (s.el.style.display === 'none') return; s.vx = (s.home.x - s.x) * 4; s.vy = (s.home.y - s.y) * 4; });
    } else if (cmd === 'toggle-mute') {
      muted = !muted; localStorage.setItem('babyMuted', muted ? '1' : '0');
      if (!muted) tone(660, 880, .1, 'sine', .1);
    } else if (cmd === 'toggle-peek') {
      peekMode = !peekMode;
      localStorage.setItem('babyPeek', peekMode ? '1' : '0');
      window.petAPI?.peekState(peekMode);
      if (mode !== 'single') applyMode('single', false);
      if (!peekMode) layoutHomes(false); // 弹回原地
      sndChime();
    } else if (cmd === 'goto-edge') {
      pinned = false; localStorage.removeItem('babyPin');
      if (!peekMode) { peekMode = true; localStorage.setItem('babyPeek', '1'); window.petAPI?.peekState(true); }
      applyMode('single', false);
      sndChime();
    } else if (cmd === 'toggle-dance') {
      danceMode = !danceMode;
      window.petAPI?.danceState(danceMode);
      ensureAudio();
      if (danceMode) {
        showBubble(stickers[activeIdx], '🎵 蹦迪时间到！', 1600);
        stickers.forEach(s => { if (s.el.style.display !== 'none') riseEmoji(s, '🎵'); });
      } else {
        showBubble(stickers[activeIdx], '呼——跳累啦，休息一下～', 1800);
      }
    } else if (cmd === 'pick') {
      trySwitch(payload);
    } else if (cmd === 'mode') {
      if (payload === 'all' && isBedtime()) {
        showBubble(stickers[activeIdx], pick(BEDTIME_NO), 2200);
      } else {
        applyMode(payload === 'all' ? 'all' : 'single', true);
        sndChime();
      }
    } else if (cmd === 'sleep') {
      asleep = true;
      releaseDrag();
      setIgnore(true);
      stage.style.display = 'none';
      window.petAPI?.sleepState(false);
    } else if (cmd === 'wake') {
      if (!asleep) return;
      asleep = false;
      stage.style.display = '';
      switchTo(activeIdx);
      window.petAPI?.sleepState(true);
    }
  });

  /* ================= 挂机小动作 ================= */
  setInterval(() => {
    if (document.hidden || active || asleep) return;
    if (isBedtime()) { if (Math.random() < .35) riseEmoji(stickers[activeIdx], '💤'); return; }
    const s = stickers[mode === 'single' ? activeIdx : Math.floor(Math.random() * BABIES.length)];
    if (s.el.style.display === 'none') return;
    const roll = Math.random();
    if (roll < .45) { s.vy -= rand(220, 380); tone(rand(500,700), rand(800,1000), .07, 'sine', .04); }
    else if (roll < .75) playAnim(s, 'wiggle');
    else riseEmoji(s, s.b.phrase === '睡觉觉' ? '💤' : pick(['💗','✨','❓','🎵','🫧']));
  }, 3800);

  /* ================= 启动 & 自适应 ================= */
  window.addEventListener('resize', () => {
    for (const s of stickers) {
      if (s.el.style.display === 'none') continue;
      if (!danceMode || s.dragging) s.spin = (s.spin || 0) * Math.max(0, 1 - dt * 2.5);
      s.x = Math.max(0, Math.min(s.x, SW() - s.w));
      s.y = Math.max(0, Math.min(s.y, SH() - s.h));
    }
    if (pinned && mode === 'single') {
      const s = stickers[activeIdx];
      s.x = Math.max(0, Math.min(s.x, SW() - s.w));
      s.y = Math.max(4, Math.min(s.y, SH() - s.h));
      localStorage.setItem('babyPin', JSON.stringify({ x: Math.round(s.x), y: Math.round(s.y) }));
    }
    layoutHomes(false);
  });
  function restorePin() {
    const saved = JSON.parse(localStorage.getItem('babyPin') || 'null');
    if (!saved || mode !== 'single') return;
    const s = stickers[activeIdx];
    setStickerSize(s, singleW());
    s.home = singleHome(s);
    s.x = Math.max(0, Math.min(saved.x, SW() - s.w));
    s.y = Math.max(4, Math.min(saved.y, SH() - s.h));
    pinned = true;
  }
  window.addEventListener('load', () => { applyMode(mode, true); restorePin(); window.petAPI?.ready(); });
  setTimeout(() => { if (!active) layoutHomes(false); }, 400);
  applyMode(mode, true);
  restorePin();


  /* ================= 闲置小提示：跟着宝宝冒泡，不挡桌面 ================= */
  function tipPool() {
    if (mode === 'all') return ['🎉 全体上场中！右键可切回「只留一个」'];
    const t = [
      '🖱️ 滚轮或双击可以换宝宝哦',
      '🖐️ 拖到任意位置轻放，我就固定在那儿',
      '🖐️ 抓住我甩向屏幕边，会飞出一个新宝宝',
      '📋 右键我有好多玩法',
      '🎵 右键开启音乐模式，我会跟着节奏蹦迪',
    ];
    if (isBedtime()) t.push('🌙 到点啦，只能陪我睡觉觉哦 💤');
    else if (peekMode) t.push('👀 鼠标靠近我，我就探出来看你');
    else t.push('👀 右键可以开启探头跟随');
    return t;
  }
  let lastTip = -1e9;
  function showTip() {
    if (document.hidden || asleep || active || danceMode) return;
    const s = stickers[mode === 'single' ? activeIdx : Math.floor(Math.random() * BABIES.length)];
    if (s.el.style.display === 'none') return;
    showBubble(s, pick(tipPool()), 3200);
  }
  setInterval(() => {
    if (performance.now() - lastTip > 24000) { showTip(); lastTip = performance.now(); }
  }, 8000);

  // 鼠标离开窗口时恢复穿透
  document.addEventListener('mouseleave', () => { if (!active) setIgnore(true); });
  // 兜底：系统中断拖拽（如菜单弹出、切窗口）时释放粘滞状态
  window.addEventListener('pointercancel', () => releaseDrag());
  window.addEventListener('blur', () => releaseDrag());

  // 🌙 作息钟：跨过 23 点 / 早上 7 点时自动切换状态
  const sndLullaby = () => [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, f * .98, .3, 'sine', .07), i * 350));
  let bedtimeOn = isBedtime();
  if (qp.has('forceactive')) activeIdx = Math.min(8, Math.max(0, parseInt(qp.get('forceactive'), 10) || 0));
  if (bedtimeOn) activeIdx = SLEEPY_IDX; // 就寝规矩优先级最高
  setInterval(() => {
    const now = isBedtime();
    if (now === bedtimeOn) return;
    bedtimeOn = now;
    ensureAudio();
    if (now) {
      switchTo(SLEEPY_IDX);
      showBubble(stickers[SLEEPY_IDX], '已经 ' + BEDTIME_HOUR + ' 点啦，宝宝要睡觉觉了 💤 晚安～', 3000);
      sndLullaby();
    } else {
      playAnim(stickers[activeIdx], 'jump');
      showBubble(stickers[activeIdx], '早上好呀～新的一天一起玩吧 🌞', 2600);
      sndChime();
    }
    refreshHint();
  }, 15000);

  // 测试钩子：?testpeek=1 时模拟鼠标绕圈移动，用于验证探头跟随
  if (qp.get('testpin') === '1') {
    setTimeout(() => {
      const s = stickers[activeIdx];
      setStickerSize(s, singleW());
      s.x = SW() * 0.35; s.y = SH() * 0.3;
      pinHere(s);
    }, 3000);
  }
  if (qp.get('clearpin') === '1') localStorage.removeItem('babyPin');
  if (qp.get('testdance') === '1') setTimeout(() => { danceMode = true; }, 3000);
  if (qp.get('testtip') === '1') setTimeout(showTip, 2500);
  if (qp.get('testpeek') === '1') {
    let tt = 0;
    setInterval(() => {
      tt += 0.06;
      lastMouse.x = SW() * (0.55 + 0.3 * Math.cos(tt));
      lastMouse.y = SH() * (0.5 + 0.36 * Math.sin(tt * 1.3));
    }, 50);
  }
})();
</script>
</body>
</html>
