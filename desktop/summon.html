<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>召回宝宝</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { user-select: none; -webkit-user-select: none; }
  #btn {
    width: 52px; height: 52px; margin: 4px;
    border-radius: 50%; border: 2.5px solid #ffb7c9;
    background: rgba(255,255,255,.95);
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    cursor: pointer; display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden; position: relative;
    animation: bounce 1.6s ease-in-out infinite;
    transition: transform .12s;
  }
  #btn:active { transform: scale(.9); }
  #btn img {
    width: 100%; height: 76%; object-fit: cover; object-position: top;
    pointer-events: none;
  }
  #badge {
    position: absolute; top: -2px; right: -2px; font-size: 14px;
    animation: bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
</style>
</head>
<body>
  <div id="btn" title="点我召回宝宝！">
    <img src="stickers/baby-9.png" alt="召回宝宝">
    <span id="badge">👋</span>
  </div>
<script>
  document.getElementById('btn').addEventListener('click', () => {
    window.petAPI.summonClick();
  });
</script>
</body>
</html>
